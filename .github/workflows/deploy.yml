name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild (Oct 19), so a page marked `ready: true` goes live on its date with no
  # push: pages go live at 13:00 UTC (6 am MST, 7 am MDT; src/lib/published.ts). It runs a
  # few minutes after the hour, because GitHub delays jobs queued exactly on the hour.
  schedule:
    - cron: '7 13 * * *'
  # "Run workflow" on the Actions tab: publish now, for a same-day fix.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs, runs `astro build`, and uploads dist/ as the Pages artifact.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
