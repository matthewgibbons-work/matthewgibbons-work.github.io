# DIGHT 250 topics this term, in order (site v2, Oct 17).
# No dates on purpose: units can shift without an edit. Source: PLAN.md "DIGHT 250 unit map".
# Fields: name, summary (one line), tier (spark | prototype | release, optional),
# prototype (the Prototype this topic feeds, optional).
# unit (slug of this topic's unit page, units/250-<slug>.md, optional; Oct 19).
#   The landing page links the topic once that page is published, so it's safe to add early.
# session (the session number, 1-14, this topic is taught in; optional; Oct 21).
#   The site's schedule page joins it to the course calendar for dates. The Open lab has none.
- name: Onboarding and Spark 1
  session: 1
  summary: Set up your repo for the new system, with the agent walking you through it one step at a time.
  tier: spark
- name: Re-run in the loop
  session: 2
  unit: re-run
  summary: Rebuild your Episode Guide with the agent, running the whole loop on ground you know.
- name: Color
  session: 3
  unit: color
  summary: "Build a style tile for a theme: four colors written three ways, with every pair's contrast checked."
  prototype: P1
- name: Typography
  session: 4
  unit: typography
  summary: Set the type on your style tile in rem with a web font, and check it at 200% zoom.
  prototype: P1
- name: Box model and display
  session: 5
  unit: box-model
  summary: Update your kit for feedback checks, and add a nav with links big enough to tap.
  prototype: P2
- name: Flexbox
  session: 6
  unit: flexbox
  summary: Lay out a header and a row of cards with Flexbox, keeping the order you see the HTML order.
  prototype: P2
- name: Grid
  session: 7
  unit: grid
  summary: Give your page a header, sidebar, and footer with Grid, and cards that choose their own columns.
  prototype: P3
- name: Responsive design
  session: 8
  unit: responsive
  summary: Make your page work from 320px up, mobile first. The Final Project brief comes out.
  prototype: P4
- name: Forms
  session: 9
  unit: forms
  summary: Write your Final Project intent brief, and learn the labelled, accessible forms P4 needs.
  prototype: P4
- name: Multimedia and positioning
  session: 10
  unit: multimedia
  summary: Add an image, a video with captions you write, a positioned badge, and a named icon link.
- name: Modern CSS
  session: 11
  unit: modern-css
  summary: Turn your colors and spacing into tokens, and add a dark mode where every pair still passes.
- name: Transitions, animations, and an accessibility audit
  session: 12
  unit: motion-audit
  summary: Add one bit of motion to your Final Project that calms down on request, then audit it and fix two things.
- name: Big live build
  session: 13
  unit: big-build
  summary: Build a small site in class, from intent brief to verified deploy, checking at every step.
  tier: release
- name: Bridge to DIGHT 340
  session: 14
  unit: bridge-to-340
  summary: Add a Watched button with your first JavaScript, and check it works from the keyboard.
- name: Open lab
  summary: Final help, if you need it.
  tier: release
