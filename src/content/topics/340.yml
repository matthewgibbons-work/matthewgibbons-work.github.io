# DIGHT 340 topics this term, in order (site v2, Oct 17).
# No dates on purpose: units can shift without an edit. Source: PLAN.md "DIGHT 340 unit map".
# Fields: name, summary (one line), tier (spark | prototype | release, optional),
# prototype (the Prototype this topic feeds, optional).
# unit (slug of this topic's unit page, units/340-<slug>.md, optional; Oct 19).
#   The landing page links the topic once that page is published, so it's safe to add early.
# session (the session number, 1–14, from PLAN.md's calendar; Oct 21). The site's
#   schedule page joins it to the course calendar for dates. Leave it off entries
#   with no regular session (the Open lab).
- name: Onboarding and Spark 1
  session: 1
  summary: Rename your repo and set it up for the new system, with the agent walking you through it.
  tier: spark
- name: The DOM
  session: 2
  unit: dom
  summary: Render your Pokémon party from an array, with real buttons that work from the keyboard.
- name: Async 1
  session: 3
  unit: async-1
  summary: Load a party in parallel with Promise.all, and show a message when one fails.
  prototype: P1
- name: Async 2
  session: 4
  unit: async-2
  summary: Fetch a Pokémon from PokéAPI with async/await, and handle loading and both kinds of failure.
  prototype: P1
- name: Modules, npm, Vite, and Vitest
  unit: modules-vite
  session: 5
  summary: Split the party into a tested module and a page, built with Vite; feedback checks on every push.
  prototype: P2
- name: Svelte intro
  unit: svelte-intro
  session: 6
  summary: Your first Svelte component, with $state and $derived; reading TypeScript annotations.
  prototype: P2
- name: Svelte logic and events
  unit: svelte-logic
  session: 7
  summary: A party list with keyed each, await, and if blocks, and zero accessibility warnings.
  prototype: P3
- name: Svelte components and props
  unit: svelte-components
  session: 8
  summary: Split the party into components with typed props and callbacks. The Final Project brief comes out.
  prototype: P4
- name: Svelte forms and shared state
  unit: svelte-forms
  session: 9
  summary: Forms with labels and announced errors, and shared state (for P4); write your Final Project intent brief.
  prototype: P4
- name: Astro intro and repo conversion
  unit: astro-intro
  session: 10
  summary: Your Final Project becomes a deployed Astro site, with a layout and build-time data.
- name: Astro content collections
  unit: astro-collections
  session: 11
  summary: Your NOTES.md files become pages on your Final Project, checked by a schema.
- name: Astro islands and client-side data
  unit: astro-islands
  session: 12
  summary: A Svelte component becomes an island on your Final Project, with view transitions.
- name: Testing and accessibility
  unit: testing-a11y
  session: 13
  summary: Playwright and axe tests for your Final Project, run on every push.
- name: Big live build
  unit: big-build
  session: 14
  summary: A whole app built together, then your Final Project's own AGENTS.md and skill.
  tier: release
- name: Open lab
  summary: Final help, if you need it.
  tier: release
