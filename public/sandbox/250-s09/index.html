<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms sandbox · DIGHT 250</title>
<!--
  Live demo sandbox for the Forms unit (session 9). Format kept from the session 7
  experiments (PLAN.md, "Experiments"). It starts as a form that looks fine to a sighted mouse
  user and fails everyone else: placeholders instead of labels, a plain text box for the email,
  radio buttons with no question, every required field red from the start, and an action that
  goes nowhere. Each demo step changes one thing. thanks.html sits beside it for step 6.
  Synced to the course site at /sandbox/250-s09/ by the site's `npm run sync`. No JavaScript.
-->
<style>
  /* ============ Your form CSS goes here (demo steps in the unit page) ============ */

  /* Steps 4 and 5: how a field with a problem looks */
  input:invalid,
  textarea:invalid {
    border-color: #b3261e;
  }

  /* ============ Look and feel only below this line ============ */

  * { box-sizing: border-box; }

  body {
    max-width: 36rem;
    margin: 0 auto;
    padding: 1rem;
    font: 1.125rem/1.5 system-ui, sans-serif;
    color: #111;
    background: #fafafa;
  }

  header, main {
    padding: 1rem;
    border: 3px solid #333;
    border-radius: 0.5rem;
    margin-block-end: 1rem;
  }

  header { background: #dbe8ff; }
  main   { background: #fff; }

  h1, h2 { margin: 0 0 0.5rem; line-height: 1.2; }

  form { display: grid; gap: 0.75rem; }

  label, legend { font-weight: 700; }

  input, textarea, button { font: inherit; }

  /* :where() keeps these at zero specificity, so the step rules above always win */
  :where(input[type="text"], input[type="email"], textarea) {
    display: block;
    width: 100%;
    padding: 0.4rem 0.6rem;
    border: 3px solid #555;
    border-radius: 0.35rem;
  }

  textarea { min-height: 5rem; }

  fieldset {
    border: 3px solid #555;
    border-radius: 0.35rem;
  }

  .choice { display: flex; align-items: center; gap: 0.5rem; }
  .choice input { width: 1.25rem; height: 1.25rem; }

  .hint { margin: 0.25rem 0 0; font-size: 1rem; color: #333; }

  button {
    justify-self: start;
    padding: 0.5rem 1.25rem;
    border: 3px solid #111;
    border-radius: 0.35rem;
    background: #ffd59e;
    font-weight: 700;
  }

  a { color: #0a3d91; font-weight: 600; }
  :focus-visible { outline: 4px solid #111; outline-offset: 3px; }
</style>
</head>
<body>
<header>
  <h1>Saturday Morning Archive</h1>
  <p>Know a cartoon we're missing? Tell us.</p>
</header>

<main>
  <h2>Suggest a show</h2>

  <form action="#">
    <!-- Steps 1 and 2: name and email -->
    <input type="text" name="name" placeholder="Your name" required>
    <input type="text" name="email" placeholder="Email" required>

    <!-- Step 3: the decade -->
    <div class="choice">
      <input type="radio" id="d70" name="decade" value="1970s">
      <label for="d70">1970s</label>
    </div>
    <div class="choice">
      <input type="radio" id="d80" name="decade" value="1980s">
      <label for="d80">1980s</label>
    </div>
    <div class="choice">
      <input type="radio" id="d90" name="decade" value="1990s">
      <label for="d90">1990s</label>
    </div>

    <!-- Step 5: why -->
    <textarea name="why" placeholder="Why should we add it?" required minlength="20"></textarea>

    <button>Send suggestion</button>
  </form>
</main>
</body>
</html>
