<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms sandbox · DIGHT 250</title>
<!--
  Code slides step 01 for the Forms unit (session 10 experiment 1: one whole page per demo step). Copied from the
  live demo sandbox for the Forms unit (session 9). Format kept from the session 7
  experiments (PLAN.md, "Experiments"). Reworked Nov 16 (session 9 experiment: the demo is a
  different problem from the Spark): S09 fixes an RSVP form with placeholder labels and radio
  buttons with no question, so this sandbox is a different form with different failures. It's a
  "Lend us a tape" form whose field names are plain <p> text, not labels; every field is
  type="text"; two groups both have a field called "Date"; every required field is red from the
  start; the year's hint isn't tied to its field; and the action goes nowhere. Radio buttons,
  checkboxes, placeholders, and changing a hint's words are left for the Spark.
  thanks.html sits beside it for step 6. Synced to the course site at /sandbox/250-s09/ by the
  site's `npm run sync`. No JavaScript.
-->
<style>
  /* ============ Your form CSS goes here (demo steps in the unit page) ============ */

  /* slide:css */
  /* Step 4: how a field with a problem looks */
  input:invalid {
    border-color: #b3261e;
  }
  /* /slide:css */

  /* ============ Look and feel only below this line ============ */

  * { box-sizing: border-box; }

  body {
    max-width: 36rem;
    margin: 0 auto;
    padding: 1rem;
    font: 1.125rem/1.5 system-ui, sans-serif;
    color: #111;
    background: #fafafa;
  }

  header, main {
    padding: 1rem;
    border: 3px solid #333;
    border-radius: 0.5rem;
    margin-block-end: 1rem;
  }

  header { background: #dbe8ff; }
  main   { background: #fff; }

  h1, h2 { margin: 0 0 0.5rem; line-height: 1.2; }

  form { display: grid; gap: 0.75rem; }

  /* The starting page's field names: they look like labels, but they're only text */
  .field-name, .group-name { margin: 0; font-weight: 700; }
  .group-name { margin-block-start: 0.5rem; font-size: 1.25rem; }

  label { font-weight: 700; }
  legend { font-weight: 700; font-size: 1.25rem; padding-inline: 0.25rem; }

  input, button { font: inherit; }

  /* :where() keeps these at zero specificity, so the step rules above always win */
  :where(input) {
    display: block;
    width: 100%;
    padding: 0.4rem 0.6rem;
    border: 3px solid #555;
    border-radius: 0.35rem;
  }

  fieldset {
    display: grid;
    gap: 0.5rem;
    border: 3px solid #555;
    border-radius: 0.35rem;
  }

  .hint { margin: 0; font-size: 1rem; color: #333; }

  button {
    justify-self: start;
    padding: 0.5rem 1.25rem;
    border: 3px solid #111;
    border-radius: 0.35rem;
    background: #ffd59e;
    font-weight: 700;
  }

  a { color: #0a3d91; font-weight: 600; }
  :focus-visible { outline: 4px solid #111; outline-offset: 3px; }
</style>
</head>
<body>
<header>
  <h1>Saturday Morning Archive</h1>
  <p>Taped cartoons off the TV in the '80s? Lend us the tape: we'll digitize it and give it back.</p>
</header>

<main>
  <h2>Lend us a tape</h2>

  <!-- slide:form -->
  <form action="#">
    <!-- Step 1: who you are -->
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" autocomplete="name" required>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel" required>

    <!-- Steps 2 and 5: about the tape -->
    <p class="field-name">Year it was recorded</p>
    <input type="text" name="year" required>
    <p class="hint">Any year from 1970 to 1999.</p>
    <p class="field-name">Link to a photo of the label (optional)</p>
    <input type="text" name="photo">

    <!-- Step 3: drop-off and pick-up -->
    <p class="group-name">Drop-off</p>
    <p class="field-name">Date</p>
    <input type="text" name="dropoff-date" required>
    <p class="field-name">Time</p>
    <input type="text" name="dropoff-time">

    <p class="group-name">Pick-up</p>
    <p class="field-name">Date</p>
    <input type="text" name="pickup-date" required>
    <p class="field-name">Time</p>
    <input type="text" name="pickup-time">

    <button>Send</button>
  </form>
  <!-- /slide:form -->
</main>
</body>
</html>
